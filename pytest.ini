[pytest]
# ─── pytest configuration ──────────────────────────────────────────────────────
testpaths       = .
python_files    = test_*.py
python_classes  = Test*
python_functions= test_*

# Show the full diff on assertion failures
addopts =
    --tb=short
    -q

# Timeout each test after 60 seconds (requires pytest-timeout)
# Install with: pip install pytest-timeout
# timeout = 60

# Markers used in this project
markers =
    unit: tests that run offline with mocked dependencies
    integration: tests that require real AWS + CockroachDB credentials
